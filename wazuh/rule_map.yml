# Sigma <-> Wazuh contract.
#
# Read by: scripts/deploy_wazuh_rules.py (what to upload),
#          scripts/test_detections_wazuh.py (assertion scoping),
#          scripts/export_manifest.py (wazuh_rule_ids for the ADTE join),
#          tests/test_rule_map.py (CI drift check: map <-> XML <-> Sigma).
#
# All Wazuh rule IDs are STRINGS - Indexer alerts carry rule.id as a string
# and ADTE reads it as such; strings end-to-end make the join zero-conversion.
#
# wazuh_rule_ids:        alerting rules - true positives must land on one of these
# wazuh_suppression_ids: level-0 filter children - a benign event landing here
#                        is the filter working, never counted as a fire

schema_version: "1.0"
rules:
  # Linux / syslog - functionally verified against the live engine (Tier 2).
  # The Sigma rule is the atomic event; the Wazuh twin adds the 6/120s
  # correlation threshold, which is where Wazuh's engine does the work.
  - sigma_id: 0471bd9a-9b43-4f31-860f-4f8bf4950058
    sigma_path: rules/linux/credential_access/ssh_brute_force.yml
    techniques: [T1110, T1110.001]
    wazuh_file: wazuh/rules/dac_linux.xml
    wazuh_rule_ids: ["100200"]
    wazuh_suppression_ids: []

  # Linux / syslog - mapped so deploy_wazuh_rules.py uploads it, but the Sigma
  # rule is still lifecycle: experimental. It is NOT yet deployed and has NOT
  # been verified against the live engine. Promote to production only after
  # `python scripts/test_detections_wazuh.py` confirms 100210 actually fires -
  # this repo's bar for production is live evidence, not a green structural CI.
  - sigma_id: b7e4d1c8-3a92-4f6b-8d15-2c9e0a7f4b63
    sigma_path: rules/linux/credential_access/ssh_password_spray.yml
    techniques: [T1110, T1110.003]
    wazuh_file: wazuh/rules/dac_linux.xml
    wazuh_rule_ids: ["100210"]
    wazuh_suppression_ids: []

  # Windows / Sysmon - deployed and production-correct (if_sid chain verified
  # against the live ruleset), but NOT functionally verifiable in this lab:
  # logtest cannot reproduce the internal windows_eventchannel decoder that
  # rule 60000 gates the whole Sysmon chain behind, and there is no Windows
  # agent sending Sysmon telemetry. See docs/wazuh_functional_testing.md.
  - sigma_id: 9e8f2a3b-1c4d-5e6f-7a8b-9c0d1e2f3a4b
    sigma_path: rules/windows/credential_access/lsass_memory_access.yml
    techniques: [T1003, T1003.001]
    wazuh_file: wazuh/rules/dac_windows.xml
    wazuh_rule_ids: ["100100"]
    wazuh_suppression_ids: []

  - sigma_id: a5c8d2e1-3f4b-5a6c-7d8e-9f0a1b2c3d4e
    sigma_path: rules/windows/execution/powershell_encoded_command.yml
    techniques: [T1059, T1059.001, T1027]
    wazuh_file: wazuh/rules/dac_windows.xml
    wazuh_rule_ids: ["100110"]
    wazuh_suppression_ids: ["100111"]
