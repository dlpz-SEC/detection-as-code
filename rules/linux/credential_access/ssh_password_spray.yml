title: SSH Password Spray Across Multiple Accounts
id: b7e4d1c8-3a92-4f6b-8d15-2c9e0a7f4b63
status: experimental
description: |
    Detects SSH authentication failures against EXISTING accounts - the atomic
    event behind a password spray. A spray is defined by breadth, not depth:
    one source tries a small number of common passwords against MANY accounts,
    staying under any per-account lockout threshold.

    This is deliberately distinct from ssh_brute_force.yml (0471bd9a-...),
    which keys on "invalid user" failures against NON-EXISTENT accounts. The
    two occupy different sshd rule chains:
      - invalid/non-existent account -> Wazuh 5710 -> our rule 100200
      - existing account, bad password -> Wazuh 5716 -> our rule 100210 (this)

    This rule expresses the atomic event so it stays portable across SIEMs.
    The breadth threshold is applied by the platform's correlation engine -
    see the Wazuh twin (wazuh/rules/dac_linux.xml, rule 100210), which fires at
    5 DISTINCT accounts from the same source IP within 120 seconds.
references:
    - https://attack.mitre.org/techniques/T1110/003/
    - https://attack.mitre.org/techniques/T1110/
    - https://www.ssh.com/academy/ssh/brute-force
author: Detection Engineering Team
date: 2026/07/16
modified: 2026/07/16
tags:
    - attack.credential_access
    - attack.t1110
    - attack.t1110.003
logsource:
    product: linux
    service: sshd
detection:
    # sshd emits "Failed password for <user> from <ip>" when the account EXISTS
    # but the password is wrong.
    selection_failure:
        keywords:
            - 'Failed password for'
    # "Failed password for invalid user <u>" means the account does not exist.
    # That is account enumeration, not a spray against real identities - it is
    # ssh_brute_force.yml's job (Wazuh 5710 / rule 100200). Excluding it here
    # keeps the two detections on disjoint evidence instead of double-alerting.
    filter_invalid_user:
        keywords:
            - 'invalid user'
    condition: selection_failure and not filter_invalid_user

level: medium

falsepositives:
    - A shared egress point (NAT gateway, VPN concentrator, jump host) that
      aggregates many users' mistyped passwords into one source IP. This is the
      dominant false positive - see tuning_notes.
    - Configuration management or CI tooling authenticating as several service
      accounts from one host after a credential rotation.
    - A stale credential in a script iterating over multiple accounts.
    - Authorized vulnerability scanners and pentest tooling.

custom:
    lifecycle: experimental
    confidence: medium
    false_positive_rate: medium

    investigation_steps: |
        1. List the DISTINCT accounts attempted from the source IP. Breadth is
           the signal: a spray touches many identities a few times each.
        2. Check whether ANY attempt from that source succeeded (sshd rule 5715
           / "Accepted password"). One success amid a spray is a live
           compromise - escalate immediately, do not just block.
        3. Check reputation of the source IP (VirusTotal / AbuseIPDB).
        4. Determine whether the source is a shared egress point. If it is, the
           finding is probably the NAT false positive - confirm with the users
           before acting.
        5. If external and unexpected, block at the firewall and force a reset
           on any account that was hit AND lacks MFA.

    tuning_notes: |
        Threshold lives in the Wazuh twin (rule 100210): 5 distinct accounts
        from the same source IP in 120 seconds.

        1. The threshold is DISTINCT ACCOUNTS, not total failures. That is what
           separates a spray (breadth) from brute force (depth) and is the whole
           reason this rule exists alongside 100200.
        2. Coverage gap this closes: Wazuh's built-in 5720 correlates 5716 by
           same_source_ip only, with no distinct-user condition, and needs 8
           failures. A spray of 5 accounts x 1 attempt each is 5 failures - 5720
           stays silent. This rule fires on it.
        3. Shared egress (NAT/VPN/jump host) is the main false positive. Add a
           level-0 suppression child for those source IPs rather than raising
           the threshold - raising it blinds you to exactly the low-and-slow
           spray this is meant to catch.
        4. This rule does NOT cover brute force against a single existing
           account (depth). Wazuh's built-in 5720 partially does at 8 failures;
           a dedicated twin for that case is open work.

    mitre_context:
        technique: T1110.003
        tactic: Credential Access
        data_sources:
            - Logon Session: Logon Session Creation
        platforms:
            - Linux

    owner: detection-engineering@example.com
    review_frequency: quarterly
    last_reviewed: 2026-07-16
