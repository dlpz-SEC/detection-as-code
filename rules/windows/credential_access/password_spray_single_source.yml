# Multi-document Sigma correlation rule: base failed-logon selection +
# value_count correlation — ONE source IP failing against many DISTINCT
# accounts in a window, the defining shape of a password spray (low-and-slow
# per account, loud across accounts).
#
# Backend capability: splunk converts (emits `| stats dc(...)`); kusto (1.0.1)
# raises NotImplementedError on correlations — CI skips it for kusto, logged.
title: Failed Authentication Spray Base
id: 9e1c7a5b-3d2f-4b8e-a6c1-4f0d9b2e6a8c
name: auth_failure_spray_base
status: experimental
description: |
    Base selector: failed Windows logon events (EventID 4625). Consumed by the
    password-spray correlation below; not intended to alert alone. Ported from
    soc-threat-hunting-lab (shared rule UUID).
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: dlpz-SEC
date: 2026/07/13
tags:
    - attack.credential_access
    - attack.t1110
    - attack.t1110.003
logsource:
    category: authentication
    product: windows
detection:
    selection:
        EventID: 4625
    condition: selection
falsepositives:
    - A misconfigured application retrying many service accounts from one host.
    - A shared NAT/VPN egress aggregating many users' failed logons.
level: medium
custom:
    lifecycle: experimental
    confidence: medium
    false_positive_rate: medium
    investigation_steps: |
        1. List the distinct accounts targeted from the source IP; a spray
           hits breadth, not depth (2-3 tries per account).
        2. Check for ANY success from that source — one success amid a spray
           is a live compromise; escalate immediately.
        3. Enrich the source IP; block at the edge if confirmed hostile.
    tuning_notes: |
        The threshold is DISTINCT ACCOUNTS, not total failures — that is what
        separates a spray from single-account brute force. Corporate NAT
        egress may need an allowlist. Reference implementation with measured
        precision/recall: v_detect_password_spray in soc-threat-hunting-lab.
    mitre_context:
        technique: T1110.003
        tactic: Credential Access
        data_sources:
            - Logon Session: Logon Session Creation
        platforms:
            - Windows
    owner: dlpz-SEC
    review_frequency: monthly
    last_reviewed: 2026-07-13
---
title: Password Spray From Single Source Correlation
id: c4a8f2d6-5b1e-4c9a-8d3f-7e2b0a6c1f9d
status: experimental
correlation:
    type: value_count
    rules:
        - auth_failure_spray_base
    group-by:
        - IpAddress
    timespan: 1h
    condition:
        gte: 5
        field: TargetUserName
tags:
    - attack.credential_access
    - attack.t1110
    - attack.t1110.003
