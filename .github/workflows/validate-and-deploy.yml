  #       env:
  #         SPLUNK_HOST: ${{ secrets.SPLUNK_HOST }}
  #         SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
  #       run: |
  #         # Deploy using Splunk REST API
  #         # This creates/updates saved searches
  #         python scripts/deploy_splunk.py \
  #           --queries-dir output/splunk/ \
  #           --host "$SPLUNK_HOST" \
  #           --token "$SPLUNK_TOKEN" \
  #           --app "detection_rules"
